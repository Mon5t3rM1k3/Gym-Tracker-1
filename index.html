<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gym Tracker</title>
<style>
  :root{--bg:#0f1115;--card:#1a1d24;--accent:#4f8cff;--text:#e8e8ea;--muted:#8a8f98;--done:#2e7d4f;}
  *{box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,sans-serif;margin:0;padding:12px;max-width:640px;margin-inline:auto;}
  h1{font-size:1.3rem;margin:8px 0;}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
  .tabs button{flex:1;min-width:70px;padding:8px;border:none;border-radius:8px;background:#232733;color:var(--text);font-size:0.85rem;cursor:pointer;}
  .tabs button.active{background:var(--accent);}
  .weekToggle{display:flex;gap:6px;margin-bottom:10px;}
  .weekToggle button{flex:1;padding:10px;border:none;border-radius:8px;background:#232733;color:var(--text);font-weight:600;cursor:pointer;}
  .weekToggle button.active{background:#ff9f43;color:#111;}
  .card{background:var(--card);border-radius:10px;padding:12px;margin-bottom:10px;}
  .card h3{margin:0 0 8px;font-size:1rem;}
  .card .note{color:var(--muted);font-size:0.78rem;margin-bottom:6px;}
  .setRow{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
  .setRow span{width:44px;font-size:0.78rem;color:var(--muted);}
  .setRow input[type=number]{width:64px;padding:6px;border-radius:6px;border:1px solid #333;background:#111319;color:var(--text);font-size:0.85rem;}
  .setRow input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);}
  .last{font-size:0.72rem;color:var(--muted);margin-left:4px;}
  .mobility{background:#1e2530;border:1px solid #2c3548;border-radius:10px;padding:12px;margin-bottom:14px;}
  .mobility h3{margin:0 0 8px;font-size:0.95rem;color:#7fb0ff;}
  .mobility label{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:0.85rem;}
  .rules{font-size:0.75rem;color:var(--muted);background:#181c24;border-radius:8px;padding:10px;margin-bottom:14px;line-height:1.5;}
  .saveBar{position:sticky;bottom:0;background:var(--bg);padding:10px 0;text-align:center;}
  .saveBar button{background:var(--accent);color:#fff;border:none;padding:12px 24px;border-radius:20px;font-size:0.9rem;font-weight:600;}
  .savedMsg{font-size:0.78rem;color:#7fd490;text-align:center;height:16px;}
</style>
</head>
<body>
<h1>🏋️ 2-Week Program Tracker</h1>

<div class="weekToggle">
  <button id="wk1Btn" class="active" onclick="setWeek(1)">Week 1 — Calisthenics</button>
  <button id="wk2Btn" onclick="setWeek(2)">Week 2 — Weights</button>
</div>
<div class="tabs" id="dayTabs"></div>

<div class="mobility">
  <h3>Daily Back Mobility (do every day)</h3>
  <div id="mobList"></div>
</div>

<div class="rules">
  <b>Progression:</b> +2 total reps/exercise per week, or slower tempo/pauses. Hit top reps both sets → +2.5kg next week. If set 2 drops badly, keep same weight. 1 warm-up set before working sets.
</div>

<div id="dayContent"></div>

<div class="saveBar">
  <button onclick="saveLog()">💾 Save Today's Session</button>
  <div class="savedMsg" id="savedMsg"></div>
</div>

<script>
const PROGRAM = {
 1:{
  1:{title:"Cardio",ex:[
    {n:"Sprint Cycle",sets:[{r:"Timer"}]},
    {n:"Skipping",sets:[{r:"Timer"}]},
    {n:"Rowing",sets:[{r:"10 min"}]},
    {n:"Farmers Walk",sets:[{r:"1",w:17.5},{r:"1",w:20},{r:"1",w:22.5}]},
    {n:"Battle Ropes",sets:[{r:"Timer"}]},
    {n:"Plank",sets:[{r:"1:30"}]},
    {n:"Vacuum",sets:[{r:"1"}]}
  ]},
  2:{title:"Legs (Calisthenics)",ex:[
    {n:"BW Squats (Tempo)",sets:[{r:100},{r:75}]},
    {n:"DB Walking Lunges (per leg)",sets:[{r:12,w:5},{r:12,w:7.5},{r:12,w:10}]},
    {n:"DB/BB RDL",sets:[{r:20,w:2.5},{r:20,w:5},{r:20,w:5}]},
    {n:"Stand Calf Raise",sets:[{r:20,w:20},{r:20,w:20}]},
    {n:"Seated Calf Raise",sets:[{r:20,w:"25kg plate"},{r:20,w:"25kg plate"}]},
    {n:"Static Standing Calf Raise",sets:[{r:"1:30 hold"}]},
    {n:"Vacuum",sets:[{r:"1"}]}
  ]},
  3:{title:"Push (Calisthenics)",ex:[
    {n:"Decline Push-Ups",sets:[{r:12},{r:15},{r:15}]},
    {n:"Wide Push-Ups (Slow Tempo)",sets:[{r:15},{r:10},{r:10}]},
    {n:"Decline Pike Push-Ups",sets:[{r:12},{r:10},{r:12}]},
    {n:"Parallel Bar Dips",sets:[{r:15},{r:12},{r:10}]},
    {n:"Bench Dips",sets:[{r:20},{r:20},{r:20}]},
    {n:"Squat Rack Triceps Ext (Lvl 8)",sets:[{r:15},{r:15},{r:15}]},
    {n:"Side Leg Raises",sets:[{r:10},{r:10},{r:10}]},
    {n:"Vacuum",sets:[{r:"1"}]}
  ]},
  4:{title:"Pull (Calisthenics)",ex:[
    {n:"Pull-Ups (Wide/Neutral)",sets:[{r:8},{r:8},{r:6}]},
    {n:"Australian Pull-Ups (Lvl 12)",sets:[{r:8},{r:8},{r:7}]},
    {n:"Chin-Up Hold (Top)",sets:[{r:"Max"},{r:"Max"},{r:"Max"}]},
    {n:"Dead Hang (active/passive)",sets:[{r:"2 sets each"}]},
    {n:"Squat Rack Bicep Curl/Reverse (Lvl 8)",sets:[{r:10},{r:10},{r:10},{r:10}]},
    {n:"DB Shoulder Row (heavy bar)",sets:[{r:10},{r:10},{r:10}]},
    {n:"Decline Leg Raise",sets:[{r:15},{r:15},{r:15}]},
    {n:"Vacuum",sets:[{r:"1"}]}
  ]},
  5:{title:"Cardio",ex:[
    {n:"Sprint Cycle",sets:[{r:"Timer"}]},
    {n:"Skipping",sets:[{r:"Timer"}]},
    {n:"Rowing",sets:[{r:"10 min"}]},
    {n:"Farmers Walk",sets:[{r:"1",w:17.5},{r:"1",w:20},{r:"1",w:22.5}]},
    {n:"Battle Ropes",sets:[{r:"Timer"}]},
    {n:"Vacuum",sets:[{r:"1"}]}
  ]},
  6:{title:"Shoulders (Weights)",ex:[
    {n:"DB/BB Overhead Press",sets:[{r:"6-8",w:20},{r:"6-8",w:22.5}]},
    {n:"DB/BB Front Raise",sets:[{r:"15-20"},{r:"15-20"}]},
    {n:"Machine Lateral Raise",sets:[{r:"12-15",w:10},{r:"12-15",w:15}]},
    {n:"DB Lateral Raise",sets:[{r:"15-20"},{r:"15-20"}]},
    {n:"DB Rotator Cuff",sets:[{r:"15-20"},{r:"15-20"}]},
    {n:"Cable Rear Delt Fly (Slow)",sets:[{r:"12-15",w:5},{r:"12-15",w:5}]},
    {n:"Russian Twist",sets:[{r:12},{r:12},{r:12}]},
    {n:"Vacuum",sets:[{r:"1"}]}
  ]}
 },
 2:{
  1:{title:"Cardio",ex:[
    {n:"Sprint Cycle",sets:[{r:"Timer"}]},
    {n:"Skipping",sets:[{r:"Timer"}]},
    {n:"Rowing",sets:[{r:"10 min"}]},
    {n:"Farmers Walk",sets:[{r:"1",w:17.5},{r:"1",w:20},{r:"1",w:15}]},
    {n:"Battle Ropes",sets:[{r:"Timer"}]},
    {n:"Vacuum",sets:[{r:"1"}]}
  ]},
  2:{title:"Legs",note:"Warm-up: BW Squats×15, Leg Swings×10/side, Hip Circles×10/side, Walking Lunges×10/side",ex:[
    {n:"Barbell Back Squat",sets:[{r:5,w:10},{r:5,w:20},{r:5,w:30},{r:5,w:40}]},
    {n:"Romanian Deadlift",sets:[{r:"6-8",w:0},{r:"6-8",w:10},{r:"6-8",w:15}]},
    {n:"DB Walking Lunges (per leg)",sets:[{r:12,w:5},{r:12,w:10},{r:10,w:15}]},
    {n:"Leg Curl",sets:[{r:"10-12",w:20},{r:"10-12",w:25}]},
    {n:"Calf Raise",sets:[{r:"12-15"},{r:"12-15"},{r:"12-15"}]},
    {n:"Hanging Leg Raise",sets:[{r:"10-15"},{r:"10-15"},{r:"10-15"}]}
  ]},
  3:{title:"Back + Biceps",note:"Warm-up: Cat-Cow×10, Band Rows×15, Scapular Pull-ups×10, Light Lat Pulldown×12",ex:[
    {n:"Deadlift",sets:[{r:"3-5",w:40},{r:"3-5",w:60},{r:"3-5",w:80}]},
    {n:"Pull-ups",sets:[{r:"6-8"},{r:"6-8"},{r:"6-8"}]},
    {n:"Seated Machine Row",sets:[{r:"8-12",w:30},{r:"8-12",w:40},{r:"8-12",w:50}]},
    {n:"Shoulder Row",sets:[{r:"10-12",w:0},{r:"10-12",w:10}]},
    {n:"Preacher Curl",sets:[{r:"12-15"},{r:"12-15"},{r:"12-15"}]},
    {n:"BB Curl",sets:[{r:"12-15"},{r:"12-15"},{r:"12-15"}]},
    {n:"DB Hammer Curl",sets:[{r:"12-15"},{r:"12-15"},{r:"12-15"}]},
    {n:"Plank",sets:[{r:"45-60s"},{r:"45-60s"},{r:"45-60s"}]},
    {n:"Vacuum",sets:[{r:"1"}]}
  ]},
  4:{title:"Chest + Triceps",note:"Warm-up: Arm Circles×15, Push-ups×10, Band Pull-aparts×15, Light DB Press×12",ex:[
    {n:"Incline Dumbbell Press",sets:[{r:"6-8",w:20},{r:"6-8",w:25},{r:"6-8",w:30},{r:"6-8",w:35}]},
    {n:"Barbell Bench Press",sets:[{r:"5-6",w:30},{r:"5-6",w:40},{r:"5-6",w:50}]},
    {n:"Low-to-High DB Fly",sets:[{r:"12-15",w:5},{r:"12-15",w:7.5},{r:"12-15",w:7.5}]},
    {n:"Decline Push-ups",sets:[{r:"10-15"},{r:"10-15"}]},
    {n:"Dumbbell Pullover",sets:[{r:"10-12",w:15},{r:"10-12",w:17.5}]},
    {n:"Skull Crushers",sets:[{r:"10-12"},{r:"10-12"},{r:"10-12"}]},
    {n:"Cable Pushdown",sets:[{r:"10-12"},{r:"10-12"},{r:"10-12"}]},
    {n:"Cable Crunch",sets:[{r:"12-15",w:30},{r:"12-15",w:40},{r:"12-15",w:50}]},
    {n:"Vacuum",sets:[{r:"1"}]}
  ]},
  5:{title:"Cardio",ex:[
    {n:"Sprint Cycle",sets:[{r:"Timer"}]},
    {n:"Skipping",sets:[{r:"Timer"}]},
    {n:"Rowing",sets:[{r:"10 min"}]},
    {n:"Farmers Walk",sets:[{r:"1",w:17.5},{r:"1",w:20},{r:"1",w:15}]},
    {n:"Battle Ropes",sets:[{r:"Timer"}]},
    {n:"Vacuum",sets:[{r:"1"}]}
  ]},
  6:{title:"Shoulders",note:"Warm-up: Arm Circles×15, Band External Rotations×15, Wall Slides×10, Pike Push-ups×12",ex:[
    {n:"Overhead Press",sets:[{r:"5-6",w:10},{r:"5-6",w:20},{r:"5-6",w:25},{r:"5-6",w:30}]},
    {n:"Lateral Raise",sets:[{r:"15-20",w:2.5},{r:"15-20",w:2.5},{r:"15-20",w:2.5}]},
    {n:"Rear Delt Fly",sets:[{r:"15-20",w:2.5},{r:"15-20",w:2.5},{r:"15-20",w:2.5}]},
    {n:"Face Pull",sets:[{r:"12-15",w:15},{r:"12-15",w:20}]},
    {n:"Russian Twist",sets:[{r:"12-15"},{r:"12-15"},{r:"12-15"}]},
    {n:"Vacuum",sets:[{r:"1"}]}
  ]}
 }
};
const MOBILITY = ["Cat-Cow — 1 min","Child's Pose — 1 min","Bird Dog — 2 sets","McGill Curl-Up — 2 sets","Glute Bridge — 2 sets","Walk — 10-20 min"];

let week = 1, day = 1;
const dayNames = {1:"Day 1",2:"Day 2",3:"Day 3",4:"Day 4",5:"Day 5",6:"Day 6"};
const LS_KEY = "gymTrackerLogs_v1";
const getLogs = () => JSON.parse(localStorage.getItem(LS_KEY) || "{}");
const setLogs = (l) => localStorage.setItem(LS_KEY, JSON.stringify(l));

function setWeek(w){
  week = w;
  document.getElementById('wk1Btn').classList.toggle('active', w===1);
  document.getElementById('wk2Btn').classList.toggle('active', w===2);
  renderTabs(); renderDay();
}
function renderTabs(){
  const el = document.getElementById('dayTabs');
  el.innerHTML = "";
  Object.keys(PROGRAM[week]).forEach(d=>{
    const b = document.createElement('button');
    b.textContent = dayNames[d];
    b.className = (parseInt(d)===day) ? 'active' : '';
    b.onclick = () => { day = parseInt(d); renderTabs(); renderDay(); };
    el.appendChild(b);
  });
}
function renderMobility(){
  const logs = getLogs();
  const key = "mobility";
  const saved = logs[key] || {};
  const el = document.getElementById('mobList');
  el.innerHTML = MOBILITY.map((m,i)=>`
    <label><input type="checkbox" id="mob${i}" ${saved[i]?'checked':''}> ${m}</label>
  `).join("");
}
function renderDay(){
  const logs = getLogs();
  const dayData = PROGRAM[week][day];
  const dayKey = `w${week}d${day}`;
  const saved = logs[dayKey] || {};
  let html = `<div class="card"><h3>${dayNames[day]} — ${dayData.title}</h3>`;
  if(dayData.note) html += `<div class="note">${dayData.note}</div>`;
  dayData.ex.forEach((ex,ei)=>{
    html += `<div style="margin-bottom:10px;"><b style="font-size:0.88rem;">${ex.n}</b>`;
    const prev = saved[ei] || [];
    ex.sets.forEach((s,si)=>{
      const p = prev[si] || {};
      const lastTxt = p.reps || p.weight ? `<span class="last">last: ${p.reps||'-'} @ ${p.weight||'bw'}</span>` : '';
      html += `<div class="setRow">
        <span>Set ${si+1}</span>
        <input type="number" step="0.5" placeholder="${s.r}" value="${p.reps ?? ''}" id="r-${ei}-${si}">
        <input type="number" step="0.5" placeholder="${s.w ?? 'bw'}" value="${p.weight ?? ''}" id="w-${ei}-${si}">
        <input type="checkbox" ${p.done?'checked':''} id="d-${ei}-${si}">
        ${lastTxt}
      </div>`;
    });
    html += `</div>`;
  });
  html += `</div>`;
  document.getElementById('dayContent').innerHTML = html;
  renderMobility();
}
function saveLog(){
  const logs = getLogs();
  const dayData = PROGRAM[week][day];
  const dayKey = `w${week}d${day}`;
  const entry = {};
  dayData.ex.forEach((ex,ei)=>{
    entry[ei] = ex.sets.map((s,si)=>({
      reps: document.getElementById(`r-${ei}-${si}`).value,
      weight: document.getElementById(`w-${ei}-${si}`).value,
      done: document.getElementById(`d-${ei}-${si}`).checked
    }));
  });
  logs[dayKey] = entry;
  const mob = {};
  MOBILITY.forEach((m,i)=> mob[i] = document.getElementById(`mob${i}`).checked);
  logs["mobility"] = mob;
  logs[dayKey+"_date"] = new Date().toISOString().slice(0,10);
  setLogs(logs);
  const msg = document.getElementById('savedMsg');
  msg.textContent = "Saved ✓ " + new Date().toLocaleTimeString();
  setTimeout(()=> msg.textContent = "", 2000);
}

renderTabs();
renderDay();
</script>
</body>
</html>
